
services:
  app-db:
    image: mysql:8.0
    container_name: app-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    ports:
      - "3306:3306"

  app-service:
    build: .
    container_name: app-service
    ports:
      - "8080:8080"
    depends_on:
      - app-db
